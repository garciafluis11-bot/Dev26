<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacy Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guided Privacy Impact Assessment intake with threshold screening, NIST Privacy Framework risk mapping, and a legal-ready Record of Processing Activities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: three-column workspace (steps · questions · live findings) that stacks to one column on phones. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --surface-2: #e9eff0;
  --border: #cfd9db;
  --fg: #16232a;
  --muted: #55666d;
  --accent: #0d6b67;
  --accent-strong: #09504d;
  --accent-soft: #d8eeec;
  --on-accent: #ffffff;
  --ok: #1d6b3d;      --ok-bg: #e3f4e9;     --ok-line: #9ccfb0;
  --warn: #7a5300;    --warn-bg: #fff3d6;   --warn-line: #e9c36a;
  --high: #8a3a0c;    --high-bg: #ffe6d6;   --high-line: #f0a77a;
  --danger: #8f1d1d;  --danger-bg: #fde8e8; --danger-line: #eb9a9a;
  --focus: #1a73e8;
  --shadow: 0 1px 2px rgb(22 35 42 / 6%), 0 6px 20px rgb(22 35 42 / 6%);

  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --radius: 12px;
  --radius-sm: 8px;
  --step-0: 0.875rem;
  --step-1: 1rem;
  --step-2: 1.125rem;
  --step-3: 1.375rem;
  --step-4: 1.875rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171b; --surface: #162126; --surface-2: #1d2b31; --border: #2e4048;
    --fg: #e4ecee; --muted: #9db0b6; --accent: #4fc2b9; --accent-strong: #79d6ce; --accent-soft: #173936; --on-accent: #062321;
    --ok: #8fe0ad; --ok-bg: #133022; --ok-line: #2e6b45;
    --warn: #f3cf7a; --warn-bg: #33280f; --warn-line: #7a6124;
    --high: #f7b48b; --high-bg: #3a2216; --high-line: #82492a;
    --danger: #f4a5a5; --danger-bg: #3a1a1a; --danger-line: #7f3434;
    --focus: #8ab4f8; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171b; --surface: #162126; --surface-2: #1d2b31; --border: #2e4048;
  --fg: #e4ecee; --muted: #9db0b6; --accent: #4fc2b9; --accent-strong: #79d6ce; --accent-soft: #173936; --on-accent: #062321;
  --ok: #8fe0ad; --ok-bg: #133022; --ok-line: #2e6b45;
  --warn: #f3cf7a; --warn-bg: #33280f; --warn-line: #7a6124;
  --high: #f7b48b; --high-bg: #3a2216; --high-line: #82492a;
  --danger: #f4a5a5; --danger-bg: #3a1a1a; --danger-line: #7f3434;
  --focus: #8ab4f8; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--step-1);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-4); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: var(--step-3); font-weight: 650; }
h3 { font-size: var(--step-2); font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: 0.85em; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--step-0); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 15px; }
.topbar-title { color: var(--muted); font-size: var(--step-0); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 120px; }
.topbar-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.save-state { font-size: var(--step-0); color: var(--muted); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; color: var(--fg);
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-small { min-height: 34px; padding: 0 12px; font-size: var(--step-0); }
.btn-danger { color: var(--danger); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Page shells ---------- */
.page {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: 220px minmax(0, 1fr); } .insights { grid-column: 2; } }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } .insights { grid-column: 1; } }

/* ---------- Step navigation ---------- */
.stepnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 14px; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width 0.3s ease; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step-btn {
  width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: center; text-align: left;
  padding: 8px 10px; border-radius: var(--radius-sm); border: 0; background: transparent; cursor: pointer; color: var(--muted);
}
.step-btn:hover { background: var(--surface-2); color: var(--fg); }
.step-btn[aria-current="step"] { background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.step-btn:disabled { cursor: not-allowed; opacity: 0.55; }
.step-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface); }
.step-btn[data-done="true"] .step-dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step-btn[aria-current="step"] .step-dot { border-color: var(--accent); }
.stepnav-mobile { display: none; }
@media (max-width: 760px) {
  .stepnav { position: static; }
  .stepnav .steps { display: none; }
  .stepnav.open .steps { display: grid; }
  .stepnav-mobile { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
}

/* ---------- Main content ---------- */
.main { min-width: 0; display: grid; gap: 20px; }
.section-head { display: grid; gap: 8px; }
.section-head p { color: var(--muted); max-width: 65ch; font-size: var(--step-2); }
.qlist { display: grid; gap: 16px; }
.qcard {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
  display: grid; gap: 12px; min-width: 0;
}
.qcard.invalid { border-color: var(--danger-line); }
.qlabel { font-family: var(--font-display); font-size: var(--step-2); font-weight: 650; line-height: 1.35; }
.qlabel .opt { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: var(--step-0); }
.qhelp { color: var(--muted); max-width: 70ch; }
.qerror { color: var(--danger); font-weight: 700; font-size: var(--step-0); }
.qexample { font-size: var(--step-0); color: var(--muted); }
.qexample strong { color: var(--fg); }
details.why { font-size: var(--step-0); }
details.why summary { cursor: pointer; color: var(--accent); font-weight: 700; width: fit-content; }
details.why > div { margin-top: 6px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-sm); max-width: 70ch; }

.input, .textarea, .select {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
}
.textarea { min-height: 96px; resize: vertical; }
.input:focus, .textarea:focus, .select:focus { outline: 3px solid var(--focus); outline-offset: 0; border-color: transparent; }

/* Choice tiles (radio + checkbox) */
.choices { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.choices.yn { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 520px; }
.choice-group-title { grid-column: 1 / -1; margin-top: 6px; }
.choice {
  position: relative; display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.choice:hover { border-color: var(--accent); }
.choice input { margin: 3px 0 0; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice-text { display: grid; gap: 2px; min-width: 0; }
.choice-hint { font-size: var(--step-0); color: var(--muted); }
.choices.yn .choice { justify-content: center; font-weight: 700; padding: 12px 8px; }
.choices.yn .choice input { position: absolute; opacity: 0; pointer-events: none; }
.choices.yn .choice:has(input[value="unsure"]:checked) { background: var(--warn-bg); border-color: var(--warn-line); }
.unsure-note { font-size: var(--step-0); background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); padding: 8px 12px; border-radius: var(--radius-sm); }

/* Glossary term buttons */
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.term:hover { color: var(--accent); }
.popover {
  position: absolute; z-index: 50; max-width: min(360px, calc(100vw - 32px)); padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--fg); color: var(--bg); box-shadow: var(--shadow); font-size: var(--step-0); line-height: 1.45;
}
.popover strong { display: block; margin-bottom: 4px; }

/* Vendor table */
.listtable-wrap { overflow-x: auto; }
.listtable { width: 100%; border-collapse: collapse; min-width: 560px; }
.listtable th { text-align: left; font-size: var(--step-0); color: var(--muted); font-weight: 700; padding: 0 6px 6px; }
.listtable td { padding: 4px 6px; vertical-align: middle; }

/* Footer nav */
.footnav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; }

/* ---------- Stepper (quick check) ---------- */
.stepper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: clamp(20px, 4vw, 36px); display: grid; gap: 18px; box-shadow: var(--shadow); }
.stepper .qlabel { font-size: var(--step-3); }
.stepper-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: flex; gap: 4px; flex-wrap: wrap; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; }
.pip[data-state="done"] { background: var(--accent); }
.pip[data-state="unsure"] { background: var(--warn-line); }
.pip[data-state="current"] { background: var(--fg); }
.stepper .choices.yn .choice { min-height: 56px; font-size: var(--step-2); }

/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.chip.low, .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
.chip.medium, .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.chip.high { background: var(--high-bg); color: var(--high); border-color: var(--high-line); }
.chip.critical, .chip.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-line); }
.chip.code { font-family: var(--font-mono); font-weight: 500; font-size: 0.75rem; cursor: help; }

/* ---------- Result (threshold) ---------- */
.verdict { border-radius: var(--radius); padding: clamp(20px, 4vw, 32px); border: 1px solid; display: grid; gap: 12px; }
.verdict.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.verdict.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.verdict.danger { background: var(--danger-bg); border-color: var(--danger-line); }
.verdict h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); }
.verdict p { max-width: 65ch; font-size: var(--step-2); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: grid; gap: 12px; min-width: 0; }
.criteria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.criterion { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: var(--step-0); }
.criterion[data-met="true"] { background: var(--high-bg); border-color: var(--high-line); }
.criterion[data-met="unsure"] { background: var(--warn-bg); border-color: var(--warn-line); }
.criterion .mark { font-family: var(--font-mono); font-weight: 700; }
.plain-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* ---------- Insights ---------- */
.insights { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 14px; min-width: 0; }
@media (max-width: 1100px) { .insights { position: static; } }
.insight { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.insight-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.insight-list li { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; font-size: var(--step-0); }
.tier-badge { font-family: var(--font-display); font-weight: 700; font-size: var(--step-3); }
.tier-badge.ok { color: var(--ok); } .tier-badge.warn { color: var(--warn); } .tier-badge.danger { color: var(--danger); }

/* ---------- Risks ---------- */
.heat { display: grid; grid-template-columns: auto repeat(5, minmax(28px, 1fr)); gap: 3px; font-size: 12px; font-variant-numeric: tabular-nums; max-width: 340px; }
.heat .cell { aspect-ratio: 1.4; border-radius: 4px; display: grid; place-items: center; font-weight: 700; max-width: 100%; }
.heat .axis { color: var(--muted); display: grid; place-items: center; }
.heat .cell.low { background: var(--ok-bg); color: var(--ok); }
.heat .cell.medium { background: var(--warn-bg); color: var(--warn); }
.heat .cell.high { background: var(--high-bg); color: var(--high); }
.heat .cell.critical { background: var(--danger-bg); color: var(--danger); }
.heat .cell.empty { opacity: 0.45; }
.risk-summary { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.risk-summary .counts { display: grid; gap: 8px; min-width: 200px; flex: 1; }
.risk-card { background: var(--surface); border: 1px solid var(--border); border-left-width: 5px; border-radius: var(--radius); padding: 20px; display: grid; gap: 12px; min-width: 0; }
.risk-card[data-rating="Low"] { border-left-color: var(--ok-line); }
.risk-card[data-rating="Medium"] { border-left-color: var(--warn-line); }
.risk-card[data-rating="High"] { border-left-color: var(--high-line); }
.risk-card[data-rating="Critical"] { border-left-color: var(--danger-line); }
.risk-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.risk-head h3 { flex: 1 1 260px; }
.risk-scores { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--step-0); }
.risk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.risk-grid h4 { margin: 0 0 6px; font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.risk-grid ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.risk-map { display: flex; gap: 6px; flex-wrap: wrap; }
.response { display: grid; gap: 10px; padding-top: 12px; border-top: 1px dashed var(--border); }
.response-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.response label { font-size: var(--step-0); font-weight: 700; display: grid; gap: 4px; }
.status-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.status-pills .choice { padding: 6px 12px; font-size: var(--step-0); }

/* ---------- Home ---------- */
.home { max-width: 1100px; margin: 0 auto; display: grid; gap: 32px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-top: 16px; }
@media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.02em; }
.hero p { font-size: var(--step-2); color: var(--muted); max-width: 55ch; margin-top: 12px; }
.hero .btn-row { margin-top: 20px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: flow; }
.flow li { counter-increment: flow; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.flow li::before { content: counter(flow); width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); }
.flow strong { display: block; }
.flow span { color: var(--muted); font-size: var(--step-0); }
.saved-wrap { overflow-x: auto; }
table.saved { width: 100%; border-collapse: collapse; font-size: var(--step-0); }
table.saved th, table.saved td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.saved th { color: var(--muted); font-weight: 700; }
table.saved td.actions { white-space: nowrap; text-align: right; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
.foundation { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.foundation div { padding: 14px; border-radius: var(--radius); background: var(--surface-2); font-size: var(--step-0); }
.foundation strong { display: block; font-family: var(--font-display); font-size: var(--step-1); margin-bottom: 2px; }

/* ---------- Report ---------- */
.report-tools { display: grid; gap: 12px; }
.paper { background: #ffffff; color: #1d2433; border-radius: var(--radius); border: 1px solid var(--border); padding: clamp(16px, 4vw, 40px); overflow-x: auto; color-scheme: light; }
.paper table { min-width: 560px; }

/* ---------- Dialogs and toasts ---------- */
dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--fg); padding: 0; width: min(640px, calc(100vw - 32px)); max-height: min(80vh, 720px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgb(10 20 24 / 45%); }
.dialog-body { padding: 20px; display: grid; gap: 12px; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.gloss-list { display: grid; gap: 12px; margin: 0; }

    },
    'international transfer': {
      term: 'International transfer',
      def: 'When personal data is sent to, stored in, or accessed from another country. Moving EU/UK data to many countries (including the US) needs a legal safeguard.'

    'sccs': {

    },

    'tia': {
      term: 'Transfer Impact Assessment (TIA)',

      def: 'People and systems get access only to the data they truly need for their job, and nothing more.'

      term: 'Data minimisation',

            { value: 'testing', label: 'Security testing (scans, penetration tests)' },

            { value: 'no', label: 'No' },

        },
        {
          id: 'test_with_real', type: 'yesno', tiers: DEEP,
          label: 'Will real people\'s information be used for testing or development?',
          help: 'Test environments are usually less protected. Fake or masked data is safer.'

        {

    {

    {
      id: 'automation',

      questions: [

    {
      id: 'monitoring',
      title: 'Monitoring details',
      short: 'Monitoring',

      showIf: function (a, f) { return f.monitoring; },
      questions: [
        {
          id: 'monitoring_type', type: 'multi',
          label: 'What kind of monitoring?',
          options: [
            { value: 'cctv', label: 'CCTV or cameras' },
            { value: 'employee', label: 'Employee computer, email, or productivity monitoring' },
            { value: 'location', label: 'Location or vehicle tracking' },
            { value: 'online', label: 'Tracking behavior on websites or apps' },
            { value: 'calls', label: 'Call or meeting recording' },
            { value: 'keystroke', label: 'Keystroke logging or screen capture' },
            { value: 'wearables', label: 'Wearables or health tracking' }

        },
        { id: 'monitoring_aware', type: 'yesno', label: 'Will people clearly know they\'re being monitored?', help: 'Through signs, notices, policies, or on-screen messages.' },
        { id: 'monitoring_covert', type: 'yesno', label: 'Will any monitoring be done secretly?' },
        { id: 'monitoring_proportionate', type: 'textarea', optional: true, label: 'Why is monitoring needed, and why wouldn\'t something less intrusive work?' }

    {
      id: 'record',
      title: 'Details for the record',
      short: 'Record',
      intro: 'Last step. A few details legal needs for the official [[Record of Processing Activities|ropa]].',
      tiers: PD,
      questions: [
        {
          id: 'org_name', type: 'text', label: 'What is your organization\'s legal name?',
          prefill: function () { return (PIA.config && PIA.config.organization.name) || undefined; }
        },
        {
          id: 'org_role', type: 'single',
          label: 'Which best describes your organization\'s role?',
          options: [
            { value: 'controller', label: 'We decide what information to collect and what to do with it', hint: 'You are the [[controller]]. This is the most common answer.' },
            { value: 'processor', label: 'We do this on behalf of another organization, following their instructions', hint: 'You are a [[processor]]' },
            { value: 'joint', label: 'We decide together with another organization', hint: '[[Joint controllers|joint controller]]' },

        {
          id: 'other_org', type: 'text', label: 'Which other organization?',
          showIf: function (a) { return a.org_role === 'processor' || a.org_role === 'joint'; }
        },
        {
          id: 'privacy_contact', type: 'text', label: 'Privacy team or Data Protection Officer contact', optional: true,
          prefill: function () { var o = PIA.config && PIA.config.organization; return (o && (o.dpoContact || o.privacyContact)) || undefined; }
        },
        { id: 'concerns', type: 'textarea', optional: true, label: 'Is there anything else that worries you, or that legal should know?' }
      ]
    }
  ];

  // Index questions by id for quick lookup.
  var byId = {};
  sections.forEach(function (s) {
    s.questions.forEach(function (q) { q.section = s.id; byId[q.id] = q; });
  });

  function optionLabel(qid, value) {
    var q = byId[qid];
    if (!q) return String(value);
    if (q.type === 'yesno') return { yes: 'Yes', no: 'No', unsure: 'Not sure' }[value] || String(value);
    var opt = (q.options || []).filter(function (o) { return o.value === value; })[0];
    return opt ? stripTerms(opt.label) : String(value);
  }

  function stripTerms(text) {
    return String(text).replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, '$1');
  }

  PIA.questions = {
    sections: sections,
    byId: byId,
    optionLabel: optionLabel,
    stripTerms: stripTerms,
    SENSITIVE_OPTIONS: SENSITIVE_OPTIONS,
    hasAny: hasAny
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*
 * Risk catalog. Each risk is triggered by answers and mapped to:
 *   - NIST Privacy Framework v1.0 subcategories (nist)
 *   - NIST PRAM problematic data actions (actions) and problems for individuals (problems)
 *
 * when(answers, ctx) returns an array of plain-language reasons; an empty array means "not triggered".
 * likelihood / impact are 1-5. adjust(answers, ctx) may return { likelihood, impact } deltas.
 * amplify: false opts out of the automatic sensitivity / scale modifiers applied by the engine.
 */
(function (root) {
  'use strict';
  var PIA = (root.PIA = root.PIA || {});

  function has(arr, v) { return Array.isArray(arr) && arr.indexOf(v) !== -1; }
  function hasAny(arr, vals) { return Array.isArray(arr) && vals.some(function (v) { return arr.indexOf(v) !== -1; }); }
  function notYes(v) { return v === 'no' || v === 'unsure'; }
  function yu(v) { return v === 'yes' || v === 'unsure'; }
  function reasons() {
    var out = [];
    for (var i = 0; i < arguments.length; i++) { if (arguments[i][0]) out.push(arguments[i][1]); }
    return out;
  }
  function unsureNote(v) { return v === 'unsure' ? ' (answered "not sure")' : ''; }

  var KEY_CONTROLS = {
    encrypt_rest: 'Encrypt stored data (data at rest).',
    encrypt_transit: 'Encrypt data in transit (HTTPS/TLS everywhere, including internal APIs).',
    mfa: 'Require multi-factor authentication for anyone who can access the data.',
    rbac: 'Restrict access by role so people only see what their job needs.'
  };

  var risks = [
    {
      id: 'R01', title: 'Collecting more information than needed',
      description: 'The more you collect, the more there is to lose, misuse, or have to explain. Extra information raises the harm of any breach.',
      nist: ['ID.IM-P6', 'CT.DP-P4', 'GV.PO-P1'], actions: ['Insecurity', 'Surveillance'], problems: ['trust', 'dignity'],
      likelihood: 3, impact: 3,
      when: function (a) {
        var n = (a.data_categories || []).length;
        return reasons(
          [a.data_minimization === 'possibly', 'You said some information may be "nice to have" rather than essential.'],
          [a.data_minimization === 'unsure', 'It isn\'t yet clear whether all the information is necessary.'],
          [n >= 10, 'A wide range of information types (' + n + ') will be collected.']
        );
      },
      mitigations: ['Go through each data field and remove anything the project can work without.', 'Make non-essential fields optional and clearly labeled.', 'Use less precise versions where possible (age range instead of birth date, city instead of address).']
    },
    {
      id: 'R02', title: 'Sensitive information is involved',
      description: 'If sensitive information is exposed or misused, people can face discrimination, embarrassment, or financial harm. The law requires a stronger justification and stronger protection.',
      nist: ['ID.RA-P1', 'GV.PO-P5', 'PR.DS-P1', 'PR.AC-P4'], actions: ['Unanticipated Revelation', 'Stigmatization'], problems: ['dignity', 'discrimination', 'economic'],
      likelihood: 3, impact: 5, amplify: false,
      when: function (a, f) {
        return reasons(
          [f.special, 'Special-category or criminal record information: ' + f.specialLabels.join(', ') + '.'],
          [f.sensitiveOther, 'Other sensitive information: ' + f.sensitiveOtherLabels.join(', ') + '.'],
          [has(a.sc_sensitive_types, 'unsure'), 'It isn\'t yet confirmed whether sensitive information is involved.']
        );
      },
      mitigations: ['Have legal confirm the legal condition for using sensitive information before launch.', 'Limit access to named individuals who need it, and log all access.', 'Encrypt sensitive fields and separate them from everyday data.', 'Avoid free-text fields where people might enter sensitive details unnecessarily.']
    },
    {
      id: 'R03', title: 'Children\'s information',
      description: 'Children may not understand the risks or their rights. Laws such as COPPA (US) and GDPR Article 8 require parental consent and extra safeguards.',
      nist: ['ID.RA-P1', 'GV.PO-P5', 'CT.PO-P1', 'CM.AW-P1'], actions: ['Induced Disclosure', 'Surveillance'], problems: ['autonomy', 'dignity', 'physical'],
      likelihood: 3, impact: 4, amplify: false,
      when: function (a, f) {
        return reasons(
          [has(a.subject_categories, 'children_u13'), 'Children under 13 are included.'],
          [has(a.subject_categories, 'children_13_17'), 'Teenagers (13 to 17) are included.'],
          [f.children && !hasAny(a.subject_categories, ['children_u13', 'children_13_17']), 'Some people may be under 18' + unsureNote(a.sc_children) + '.']
        );
      },
      mitigations: ['Confirm the age of users and obtain verifiable parental consent where required (e.g. under 13 in the US).', 'Write a child-friendly explanation of what happens to their information.', 'Use high-privacy settings by default; switch off profiling, targeted ads and location sharing for minors.']
    },
    {
      id: 'R04', title: 'People in a vulnerable position',
      description: 'People who are vulnerable, or who can\'t easily refuse (like employees), may not be able to protect their own interests or freely agree.',
      nist: ['ID.RA-P1', 'CM.AW-P1', 'CT.PO-P3'], actions: ['Induced Disclosure', 'Unwarranted Restriction'], problems: ['autonomy', 'exclusion', 'dignity'],
      likelihood: 3, impact: 4, amplify: false,
      when: function (a) {
        return reasons(
          [yu(a.sc_vulnerable), 'Some people may be vulnerable or unable to easily say no' + unsureNote(a.sc_vulnerable) + '.'],
          [has(a.subject_categories, 'patients'), 'Patients are included.'],
          [has(a.subject_categories, 'vulnerable_adults'), 'Vulnerable adults are included.'],
          [has(a.subject_categories, 'employees') && a.legal_basis === 'consent', 'Employees are asked for consent, which may not be freely given because of the power imbalance.']
        );
      },
      mitigations: ['Don\'t rely on consent where people can\'t freely refuse; choose a different legal basis with legal.', 'Provide accessible explanations (plain language, other languages, accessible formats).', 'Give people an easy, safe way to raise concerns or object.']
    },
    {
      id: 'R05', title: 'Large-scale processing',
      description: 'The more people involved, the more people are harmed if something goes wrong, and the more attractive the data is to attackers.',
      nist: ['ID.RA-P4', 'PR.DS-P5', 'PR.PO-P7'], actions: ['Insecurity'], problems: ['economic', 'trust'],
      likelihood: 3, impact: 3, amplify: false,
      adjust: function (a, f) { return { likelihood: f.veryLarge ? 1 : 0, impact: f.veryLarge ? 1 : 0 }; },
      when: function (a, f) {
        return reasons(
          [f.largeScale && a.sc_scale !== 'unsure', 'Information about ' + PIA.questions.optionLabel('sc_scale', a.sc_scale).toLowerCase() + ' people.'],
          [a.sc_scale === 'unsure', 'The number of people involved isn\'t known yet, so we\'ve assumed it could be large.']
        );
      },
      mitigations: ['Split data so a single breach can\'t expose everyone.', 'Put alerts in place for unusually large downloads or exports.', 'Test the incident response plan against this system.']
    },
    {
      id: 'R06', title: 'People may not know what\'s happening',
      description: 'If people aren\'t told clearly how their information is used, they can\'t make informed choices. Lack of transparency is a common reason for regulatory fines.',
      nist: ['CM.AW-P1', 'CM.PO-P1', 'CM.AW-P3'], actions: ['Unanticipated Revelation'], problems: ['trust', 'autonomy'],
      likelihood: 4, impact: 3,
      when: function (a) {
        return reasons(
          [a.notice === 'not_yet', 'People haven\'t been told yet.'],
          [a.notice === 'no', 'People won\'t be told, or it isn\'t possible to tell them.'],
          [a.notice === 'unsure', 'It isn\'t clear whether people will be told.'],
          [a.notice_plain === 'no' || a.notice_plain === 'unsure', 'The explanation may not be short, clear, or easy to find.']
        );
      },
      mitigations: ['Update the privacy notice before launch to cover this use.', 'Add a short "just-in-time" message where information is collected.', 'Have someone outside the project read the notice and check it makes sense.']
    },
    {
      id: 'R07', title: 'Using information in unexpected ways',
      description: 'Using information for something people didn\'t expect, or for a new purpose, breaks trust and may breach the "purpose limitation" rule.',
      nist: ['ID.IM-P5', 'GV.PO-P1', 'CT.PO-P1'], actions: ['Appropriation'], problems: ['trust', 'autonomy'],
      likelihood: 4, impact: 3,
      when: function (a) {
        return reasons(
          [notYes(a.purpose_expected), 'People may not expect their information to be used this way' + unsureNote(a.purpose_expected) + '.'],
          [yu(a.sc_new_use), 'Information is being reused for a different reason than it was collected for' + unsureNote(a.sc_new_use) + '.']
        );
      },
      mitigations: ['Ask legal to check whether the new use is compatible with the original purpose.', 'Tell people about the new use before it starts and, where needed, ask for consent.', 'Keep datasets for different purposes separate.']
    },
    {
      id: 'R08', title: 'Legal basis not yet confirmed',
      description: 'Every use of personal data needs a legal basis. Without one, the processing may be unlawful from the start.',
      nist: ['GV.PO-P5', 'CT.PO-P1'], actions: ['Appropriation'], problems: ['trust', 'autonomy'],
      likelihood: 3, impact: 4,
      when: function (a) { return reasons([a.legal_basis === 'unsure', 'The legal basis hasn\'t been decided.']); },
      mitigations: ['Legal to confirm and document the legal basis before any data is collected.']
    },
    {
      id: 'R09', title: 'Permission (consent) may not be valid',
      description: 'Consent only counts if it\'s a clear, active, informed choice that people can take back. Pre-ticked boxes or "by continuing you agree" usually don\'t count.',
      nist: ['CT.PO-P1', 'CT.PO-P3', 'CM.AW-P1', 'CT.DM-P7'], actions: ['Induced Disclosure'], problems: ['autonomy', 'trust'],
      likelihood: 4, impact: 3,
      when: function (a) {
        if (a.legal_basis !== 'consent') return [];
        return reasons(
          [a.consent_mechanism === 'prechecked', 'Consent boxes are pre-ticked.'],
          [a.consent_mechanism === 'implied', 'Consent is assumed from using the service.'],
          [a.consent_mechanism === 'undecided', 'How consent will be collected isn\'t decided.'],
          [notYes(a.consent_withdraw), 'People may not be able to easily withdraw consent' + unsureNote(a.consent_withdraw) + '.']
        );
      },
      mitigations: ['Use an unticked box or a clear "I agree" button for each separate purpose.', 'Record who agreed, when, and to what wording.', 'Make withdrawing as easy as agreeing (one click or toggle), and stop processing when someone withdraws.']
    },
    {
      id: 'R10', title: 'Business-need justification not documented',
      description: 'Relying on "legitimate interests" requires a written balancing test showing the business need doesn\'t override people\'s rights.',
      nist: ['GV.PO-P5', 'ID.RA-P3'], actions: ['Appropriation'], problems: ['trust', 'autonomy'],
      likelihood: 3, impact: 3,
      when: function (a) {
        return a.legal_basis === 'legitimate_interests'
          ? reasons([notYes(a.li_balancing), 'No legitimate interests assessment has been documented' + unsureNote(a.li_balancing) + '.'])
          : [];
      },
      mitigations: ['Complete a legitimate interests assessment (purpose, necessity, balancing) with the privacy team.', 'Offer people a simple way to object.']
    },
    {
      id: 'R11', title: 'No confirmed justification for sensitive information',
      description: 'Sensitive (special-category) information needs a specific legal condition in addition to the legal basis. Without one, processing is prohibited under GDPR Article 9.',
      nist: ['GV.PO-P5'], actions: ['Appropriation', 'Stigmatization'], problems: ['dignity', 'discrimination'],
      likelihood: 3, impact: 5, amplify: false,
      when: function (a, f) { return f.special ? reasons([a.special_condition === 'unsure', 'The condition for using sensitive information isn\'t confirmed.']) : []; },
      mitigations: ['Legal to identify and document the Article 9 / Article 10 condition (and any national-law basis) before processing starts.']
    },
    {
      id: 'R12', title: 'Monitoring or tracking people',
      description: 'Watching or tracking people can feel intrusive, change how they behave, and reveal more about them than intended.',
      nist: ['CT.DP-P1', 'CT.DP-P3', 'CM.AW-P3', 'ID.RA-P3'], actions: ['Surveillance'], problems: ['autonomy', 'dignity', 'liberty'],
      likelihood: 4, impact: 4,
      adjust: function (a) { return { likelihood: notYes(a.monitoring_aware) ? 1 : 0, impact: 0 }; },
      when: function (a, f) {
        if (!f.monitoring) return [];
        var types = (a.monitoring_type || []).map(function (t) { return PIA.questions.optionLabel('monitoring_type', t).toLowerCase(); });
        return reasons(
          [true, types.length ? 'Monitoring involves: ' + types.join(', ') + '.' : 'The project involves watching or tracking people' + unsureNote(a.sc_monitoring) + '.'],
          [yu(a.sc_public_monitoring), 'Monitoring covers public or shared spaces, or happens at large scale.'],
          [notYes(a.monitoring_aware), 'People may not clearly know they are being monitored.']
        );
      },
      mitigations: ['Limit monitoring to what is strictly necessary: specific places, times, and people.', 'Tell people clearly (signs, policies, on-screen notices) before monitoring starts.', 'Aggregate or anonymise results where you don\'t need to know who did what.', 'Set short retention periods for recordings and logs.']
    },
    {
      id: 'R13', title: 'Secret monitoring',
      description: 'Covert monitoring is highly intrusive and is only lawful in narrow, exceptional circumstances with strict controls.',
      nist: ['CM.AW-P1', 'CM.AW-P3', 'GV.PO-P5'], actions: ['Surveillance', 'Unanticipated Revelation'], problems: ['dignity', 'autonomy', 'trust'],
      likelihood: 4, impact: 5,
      when: function (a) { return reasons([yu(a.monitoring_covert), 'Some monitoring may be done secretly' + unsureNote(a.monitoring_covert) + '.']); },
      mitigations: ['Avoid covert monitoring. If truly necessary (e.g. a specific criminal investigation), get written legal approval, limit it in time and scope, and document the justification.']
    },
    {
      id: 'R14', title: 'Automated decisions about people',
      description: 'Decisions made by a system without real human review can be wrong, unfair, or impossible to challenge, and can seriously affect people\'s lives.',
      nist: ['CT.DM-P10', 'ID.RA-P2', 'CM.AW-P8', 'GV.PO-P5'], actions: ['Distortion', 'Unwarranted Restriction'], problems: ['discrimination', 'economic', 'exclusion'],
      likelihood: 3, impact: 5,
      when: function (a, f) {
        return reasons(
          [f.autoDecision, 'Important decisions may be made without a person checking them' + unsureNote(a.sc_auto_decision) + '.'],
          [a.human_review === 'none', 'System results apply automatically with no human review.'],
          [a.human_review === 'some', 'Human review is partial or may be a rubber stamp.']
        );
      },
      mitigations: ['Have a trained person meaningfully review decisions, with authority to overrule the system.', 'Tell people when a decision is automated and how to ask for a human review.', 'Monitor decision outcomes regularly for errors.']
    },
    {
      id: 'R15', title: 'Unfair or biased outcomes',
      description: 'Scoring and AI systems can treat some groups unfairly, for example by age, gender, ethnicity, or disability, even when that isn\'t intended.',
      nist: ['ID.RA-P2', 'CT.DM-P10'], actions: ['Distortion'], problems: ['discrimination', 'exclusion'],
      likelihood: 3, impact: 4,
      when: function (a, f) {
        if (!(f.profiling || f.ai || f.autoDecision)) return [];

      next: ['Contact the privacy team or DPO to let them know a DPIA is under way.', 'Complete all remaining sections in detail.', 'Agree actions for every risk. If high risk remains after actions, the regulator may need to be consulted before launch (GDPR Article 36).']
    }
  };

  function screen(a, f) {
    var criteria = CRITERIA.map(function (c) {
      var v = c.test(a);
      return { id: c.id, label: c.label, questions: c.q, answer: v, met: v === 'yes' || (v === 'unsure' && cfg().threshold.treatUnsureAsYes), unconfirmed: v === 'unsure' };
    });
    var met = criteria.filter(function (c) { return c.met; });
    var mandatory = MANDATORY.filter(function (m) { return m.test(a, f); }).map(function (m) { return { id: m.id, label: m.label }; });
    var elevating = ELEVATING.filter(function (e) { return yu(a[e.q]); }).map(function (e) { return { id: e.id, label: e.label, unconfirmed: a[e.q] === 'unsure' }; });

    var unsure = [];
    Q.sections[1].questions.forEach(function (q) {
      var v = a[q.id];
      if (v === 'unsure' || has(v, 'unsure')) unsure.push({ id: q.id, label: Q.stripTerms(q.label) });
    });

    var started = a.sc_personal_data !== undefined;
    var t = cfg().threshold;
    var tier;
    if (!started) tier = null;
    else if (!f.personal) tier = 'none';
    else if (mandatory.length || met.length >= t.dpiaCriteria) tier = 'high';
    else if (met.length >= t.piaCriteria || elevating.length >= t.piaElevatingFactors) tier = 'medium';
    else tier = 'low';

    var rationale = [];
    if (tier === 'none') rationale.push('No personal data is involved.');
    mandatory.forEach(function (m) { rationale.push('Mandatory DPIA trigger: ' + m.label + '.'); });
    if (met.length) rationale.push(met.length + ' of 9 high-risk criteria met (EDPB guidelines; ' + t.dpiaCriteria + ' or more usually means a DPIA is required).');
    if (elevating.length) rationale.push(elevating.length + ' elevating factor' + (elevating.length > 1 ? 's' : '') + ': ' + elevating.map(function (e) { return e.label.toLowerCase(); }).join('; ') + '.');
    if (tier === 'low') rationale.push('No high-risk criteria met.');

    return {
      started: started,
      tier: tier,
      tierInfo: tier ? TIERS[tier] : null,
      criteria: criteria,
      criteriaMet: met,
      mandatory: mandatory,
      elevating: elevating,
      unsure: unsure,
      rationale: rationale
    };
  }

  /* ---------- Visibility ---------- */

  function sectionVisible(s, a, ctx) {
    var tier = ctx.screening.tier || 'low';
    if (s.tiers.indexOf(tier) === -1) return false;
    if (s.showIf && !s.showIf(a, ctx.flags)) return false;
    return true;
  }

  function questionVisible(q, a, ctx) {
    var tier = ctx.screening.tier || 'low';
    if (q.tiers && q.tiers.indexOf(tier) === -1) return false;
    if (q.showIf && !q.showIf(a, ctx.flags)) return false;
    return true;
  }

  function visibleSections(a, ctx) {
    return Q.sections.filter(function (s) { return sectionVisible(s, a, ctx); });
  }

  function visibleQuestions(section, a, ctx) {
    return section.questions.filter(function (q) { return questionVisible(q, a, ctx); });
  }

  /* ---------- Context (two passes: raw answers, then answers to visible questions only) ---------- */

  function rawContext(a) {
    var flags = computeFlags(a);
    var screening = screen(a, flags);
    flags.tier = screening.tier;
    return { flags: flags, screening: screening };
  }

  // Answers to questions that are hidden (e.g. the user changed an earlier answer) are ignored.
  function effectiveAnswers(a, ctx) {
    var out = {};
    visibleSections(a, ctx).forEach(function (s) {
      visibleQuestions(s, a, ctx).forEach(function (q) { if (!isBlank(a[q.id])) out[q.id] = a[q.id]; });
    });
    return out;
  }

  function context(a) {
    var first = rawContext(a);
    var eff = effectiveAnswers(a, first);
    var ctx = rawContext(eff);
    ctx.answers = eff;
    return ctx;
  }

  function prefill(section, a, ctx) {
    var changed = false;
    visibleQuestions(section, a, ctx).forEach(function (q) {
      if (q.prefill && a[q.id] === undefined) {
        var v = q.prefill(a, ctx.flags);
        if (v !== undefined && !(Array.isArray(v) && !v.length)) { a[q.id] = v; changed = true; }
      }
    });
    return changed;
  }

  function sectionProgress(section, a, ctx) {
    var qs = visibleQuestions(section, a, ctx).filter(function (q) { return !q.optional; });
    var answered = qs.filter(function (q) { return !isBlank(a[q.id]); }).length;
    return { answered: answered, total: qs.length, complete: answered === qs.length };
  }

  function missingRequired(section, a, ctx) {
    return visibleQuestions(section, a, ctx).filter(function (q) { return q.required && isBlank(a[q.id]); });
  }

  function unanswered(a, ctx) {
    var out = [];
    visibleSections(a, ctx).forEach(function (s) {
      visibleQuestions(s, a, ctx).forEach(function (q) {
        if (!q.optional && isBlank(a[q.id])) out.push({ section: s.title, id: q.id, label: Q.stripTerms(q.label) });
      });
    });
    return out;
  }

  /* ---------- Risk evaluation ---------- */

  function clamp(n) { return Math.max(1, Math.min(5, n)); }

  function rating(score) {
    var bands = cfg().risk.bands;
    for (var i = 0; i < bands.length; i++) if (score <= bands[i].max) return bands[i].label;
    return bands[bands.length - 1].label;
  }

  var STATUS = {
    open: 'Not started',
    planned: 'Planned',
    implemented: 'In place',
    accepted: 'Risk accepted'
  };

  function evaluateRisks(a, ctx, overrides) {
    overrides = overrides || {};
    var f = ctx.flags;
    var out = [];
    PIA.risks.forEach(function (r) {
      var why = r.when(a, f) || [];
      if (!why.length) return;
      var L = r.likelihood, I = r.impact;
      var adj = r.adjust ? r.adjust(a, f) : null;
      if (adj) { L += adj.likelihood || 0; I += adj.impact || 0; }
      // One impact bump when the people or data make harm more severe, or when very many people are affected.
      if (r.amplify !== false && (f.special || f.children || f.vulnerable || f.veryLarge)) I += 1;
      L = clamp(L); I = clamp(I);
      var score = L * I;
      var o = overrides[r.id] || {};
      var status = o.status || 'open';
      var reduce = cfg().risk.mitigationLikelihoodReduction;
      var rL = (status === 'implemented' || status === 'planned') ? clamp(L - reduce) : L;
      var rScore = rL * I;
      out.push({
        id: r.id,
        title: r.title,
        description: r.description,
        reasons: why,
        nist: r.nist,
        actions: r.actions,
        problems: r.problems,
        mitigations: typeof r.mitigations === 'function' ? r.mitigations(a, f) : r.mitigations,
        likelihood: L, impact: I, score: score, rating: rating(score),
        status: status, statusLabel: STATUS[status],
        owner: o.owner || '', due: o.due || '', notes: o.notes || '',
        residualLikelihood: rL, residualScore: rScore, residualRating: rating(rScore),
        residualProjected: status === 'planned'
      });
    });
    out.sort(function (x, y) { return y.score - x.score || x.id.localeCompare(y.id); });
    return out;
  }

  function riskSummary(risks) {
    var bands = cfg().risk.bands.map(function (b) { return b.label; });
    var count = function (key) {
      var c = {}; bands.forEach(function (b) { c[b] = 0; });
      risks.forEach(function (r) { c[r[key]] += 1; });
      return c;
    };
    var highest = function (key) {
      for (var i = bands.length - 1; i >= 0; i--) if (risks.some(function (r) { return r[key] === bands[i]; })) return bands[i];
      return 'None identified';
    };
    var byFunction = {};
    Object.keys(PIA.nist.functions).forEach(function (fn) { byFunction[fn] = 0; });
    var subs = {};
    risks.forEach(function (r) {
      var fns = uniq(r.nist.map(PIA.nist.functionOf));
      fns.forEach(function (fn) { byFunction[fn] += 1; });
      r.nist.forEach(function (s) { (subs[s] = subs[s] || []).push(r.id); });
    });
    return {
      total: risks.length,
      inherent: count('rating'),
      residual: count('residualRating'),
      highestInherent: highest('rating'),
      highestResidual: highest('residualRating'),
      openActions: risks.filter(function (r) { return r.status === 'open' || r.status === 'planned'; }).length,
      byFunction: byFunction,
      subcategories: subs
    };
  }

  /* ---------- Applicable law hints (indicative only) ---------- */

  function applicableLaws(a, f) {
    var out = [];
    var cats = arr(a.data_categories);
    var subj = arr(a.subject_categories);
    var purposes = arr(a.purpose_categories);
    if (f.eu) out.push({ law: 'EU General Data Protection Regulation (GDPR)', why: 'People in the EU/EEA.' });
    if (f.uk) out.push({ law: 'UK GDPR and Data Protection Act 2018', why: 'People in the UK.' });
    if ((f.eu || f.uk) && has(cats, 'online_ids')) out.push({ law: 'ePrivacy Directive / UK PECR (cookies and electronic marketing)', why: 'Online identifiers (cookies, device IDs) for EU/UK people.' });
    if (f.eu && (f.ai || f.autoDecision)) out.push({ law: 'EU AI Act', why: 'AI or automated decision-making affecting people in the EU.' });
    if (f.us) out.push({ law: 'US state comprehensive privacy laws (e.g. California CCPA/CPRA, Virginia, Colorado, Texas)', why: 'People in the US. Which states apply depends on where people live and your organization\'s size and data volumes.' });
    if (f.us && f.childrenUnder13) out.push({ law: 'Children\'s Online Privacy Protection Act (COPPA)', why: 'Children under 13 in the US.' });
    if (f.us && has(cats, 'health')) out.push({ law: 'HIPAA (if a covered entity or business associate) and state health-data laws (e.g. Washington My Health My Data Act)', why: 'Health information about people in the US.' });
    if (f.us && has(cats, 'biometric')) out.push({ law: 'State biometric privacy laws (e.g. Illinois BIPA, Texas CUBI)', why: 'Biometric information about people in the US.' });
    if (f.us && has(cats, 'financial')) out.push({ law: 'Gramm-Leach-Bliley Act (if a financial institution)', why: 'Financial account information about people in the US.' });
    if (f.us && (has(subj, 'students') || has(cats, 'education'))) out.push({ law: 'FERPA (if an educational institution or acting for one)', why: 'Student or education records in the US.' });
    if (f.us && purposes.indexOf('marketing') !== -1) out.push({ law: 'CAN-SPAM Act and TCPA (email, text, and call marketing)', why: 'Marketing to people in the US.' });
    if (f.us && (has(subj, 'applicants') || has(subj, 'employees')) && has(cats, 'criminal')) out.push({ law: 'Fair Credit Reporting Act and state "ban the box" laws', why: 'Background checks on US applicants or employees.' });
    if (f.canada) out.push({ law: 'PIPEDA and provincial laws (e.g. Quebec Law 25)', why: 'People in Canada.' });
    if (has(arr(a.subject_regions), 'latam')) out.push({ law: 'Latin American data protection laws (e.g. Brazil LGPD)', why: 'People in Latin America.' });
    if (has(arr(a.subject_regions), 'apac')) out.push({ law: 'Asia-Pacific data protection laws (e.g. Singapore PDPA, Australia Privacy Act, India DPDP Act)', why: 'People in Asia-Pacific.' });
    return out;
  }

  /* ---------- Display helpers ---------- */

  function answerText(qid, v) {
    var q = Q.byId[qid];
    if (isBlank(v)) return '';
    if (!q) return String(v);
    if (q.type === 'list') {
      return arr(v).filter(function (row) { return row && row.name; }).map(function (row) {
        var bits = [row.service, row.location, row.dpa ? 'DPA: ' + ({ yes: 'Yes', no: 'No', unsure: 'Not sure' }[row.dpa] || row.dpa) : ''].filter(Boolean);
        return row.name + (bits.length ? ' (' + bits.join(', ') + ')' : '');
      }).join('; ');
    }
    if (Array.isArray(v)) return v.map(function (x) { return Q.optionLabel(qid, x); }).join('; ');
    if (q.type === 'single' || q.type === 'yesno') return Q.optionLabel(qid, v);
    return String(v);
  }

  /* ---------- Record of Processing Activities ---------- */

  function recordId(state) {
    var d = new Date(state.createdAt || Date.now());
    var ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    return 'PIA-' + ymd + '-' + String(state.id || '').slice(-4).toUpperCase();
  }

  function buildRopa(state) {
    var raw = state.answers || {};
    var ctx = context(raw);
    var a = ctx.answers;
    var f = ctx.flags;
    var s = ctx.screening;
    var risks = evaluateRisks(a, ctx, state.risks);
    var sum = riskSummary(risks);
    var t = function (qid) { return answerText(qid, a[qid]); };
    var join = function () { return Array.prototype.slice.call(arguments).filter(Boolean).join(' | '); };
    var org = cfg().organization;

    var transfers;
    if (!f.crossBorder) transfers = 'None identified';
    else transfers = join('Countries: ' + (t('storage_locations') || 'not specified') + (a.storage_other ? ' (' + a.storage_other + ')' : ''), 'Safeguard: ' + (t('transfer_mechanism') || 'not specified'), a.transfer_tia ? 'Transfer impact assessment: ' + t('transfer_tia') : '');

    var assessment = s.tierInfo ? s.tierInfo.label : 'Screening not completed';

    var fields = [
      { key: 'record_id', label: 'Record ID', value: recordId(state) },
      { key: 'activity', label: 'Name of processing activity', ref: 'Art. 30(1)', value: a.project_name || '' },
      { key: 'description', label: 'Description', value: a.project_description || '' },
      { key: 'controller', label: 'Controller name and contact', ref: 'Art. 30(1)(a)', value: join(a.org_name || org.name, org.address, a.privacy_contact ? 'Privacy contact: ' + a.privacy_contact : '') },
      { key: 'role', label: 'Organization\'s role', value: join(t('org_role'), a.other_org ? 'Other party: ' + a.other_org : '') },
      { key: 'dpo', label: 'DPO / privacy contact', ref: 'Art. 30(1)(a)', value: a.privacy_contact || org.dpoContact || org.privacyContact || '' },
      { key: 'owner', label: 'Business owner', value: join(a.project_owner, a.owner_email, a.department) },
      { key: 'status', label: 'Project stage / start date', value: join(t('project_stage'), a.go_live) },
      { key: 'purposes', label: 'Purposes of processing', ref: 'Art. 30(1)(b)', value: join(t('purpose_categories'), a.purpose_detail) },
      { key: 'lawful_basis', label: 'Lawful basis (Art. 6)', value: legalBasisText(a) },
      { key: 'special_condition', label: 'Special-category / criminal data condition (Art. 9/10)', value: f.special ? (t('special_condition') || 'Not specified') : 'Not applicable' },
      { key: 'subjects', label: 'Categories of data subjects', ref: 'Art. 30(1)(c)', value: join(t('subject_categories'), a.subject_other) },
      { key: 'volume', label: 'Approximate number of people', value: t('sc_scale') },
      { key: 'regions', label: 'Where data subjects are located', value: t('subject_regions') },
      { key: 'data_categories', label: 'Categories of personal data', ref: 'Art. 30(1)(c)', value: t('data_categories') },
      { key: 'special_data', label: 'Sensitive / special-category data', value: f.special || f.sensitiveOther ? f.specialLabels.concat(f.sensitiveOtherLabels).join('; ') : 'None' },
      { key: 'data_elements', label: 'Data elements', value: a.data_elements || '' },
      { key: 'sources', label: 'Sources of data', value: t('sources') },
      { key: 'systems', label: 'Systems and applications', value: a.systems || '' },
      { key: 'internal_access', label: 'Internal access', value: t('internal_access') },
      { key: 'recipients', label: 'Categories of recipients', ref: 'Art. 30(1)(d)', value: t('recipients') },
      { key: 'vendors', label: 'Processors / third parties', value: t('vendors') },
      { key: 'sale_share', label: 'Sold or shared for targeted advertising (US)', value: t('sell_share') || 'No' },
      { key: 'transfers', label: 'Transfers to third countries and safeguards', ref: 'Art. 30(1)(e)', value: transfers },
      { key: 'retention', label: 'Retention period', ref: 'Art. 30(1)(f)', value: join(t('retention_period'), a.retention_reason) },
      { key: 'deletion', label: 'Deletion / disposal method', value: t('deletion_method') },
      { key: 'security', label: 'Technical and organizational security measures', ref: 'Art. 30(1)(g)', value: join(t('security_controls'), a.security_review ? 'Security review: ' + t('security_review') : '') },
      { key: 'adm', label: 'Automated decision-making / profiling', value: (f.autoDecision || f.profiling) ? join(f.profiling ? 'Profiling: yes' : '', f.autoDecision ? 'Automated decisions: yes' : '', a.human_review ? 'Human review: ' + t('human_review') : '') : 'No' },
      { key: 'notice', label: 'Transparency / privacy notice', value: t('notice') },
      { key: 'rights', label: 'Data subject rights supported', value: rightsText(a) },
      { key: 'assessment', label: 'Assessment outcome', value: assessment },
      { key: 'screening_rationale', label: 'Screening rationale', value: s.rationale.join(' ') },
      { key: 'risk_inherent', label: 'Highest inherent risk', value: sum.highestInherent },
      { key: 'risk_residual', label: 'Highest residual risk', value: sum.highestResidual },
      { key: 'risk_count', label: 'Risks identified / open actions', value: sum.total + ' / ' + sum.openActions },
      { key: 'laws', label: 'Potentially applicable laws (indicative)', value: applicableLaws(a, f).map(function (l) { return l.law; }).join('; ') },
      { key: 'record_status', label: 'Record status', value: state.status === 'submitted' ? 'Submitted to legal' + (state.submittedAt ? ' on ' + state.submittedAt.slice(0, 10) : '') : 'Draft' },
      { key: 'last_updated', label: 'Last updated', value: (state.updatedAt || '').slice(0, 10) }
    ];
    return { fields: fields, ctx: ctx, risks: risks, summary: sum, laws: applicableLaws(a, f) };
  }

  function legalBasisText(a) {
    if (!a.legal_basis) return '';
    var out = Q.optionLabel('legal_basis', a.legal_basis);
    var formal = {
      contract: 'Art. 6(1)(b) contract', legal_obligation: 'Art. 6(1)(c) legal obligation', consent: 'Art. 6(1)(a) consent',
      legitimate_interests: 'Art. 6(1)(f) legitimate interests', vital_interests: 'Art. 6(1)(d) vital interests', public_task: 'Art. 6(1)(e) public task'
    }[a.legal_basis];
    return formal ? formal + ' (' + out + ')' : 'To be confirmed by legal';
  }

  function rightsText(a) {
    var parts = [];
    [['rights_access', 'Access'], ['rights_correct', 'Correction'], ['rights_delete', 'Deletion'], ['rights_optout', 'Opt-out'], ['complaints', 'Complaints channel']].forEach(function (p) {
      if (a[p[0]]) parts.push(p[1] + ': ' + answerText(p[0], a[p[0]]));
    });
    return parts.join('; ');
  }

  PIA.engine = {
    TIERS: TIERS,
    TIER_ORDER: TIER_ORDER,
    STATUS: STATUS,
    CRITERIA: CRITERIA,
    computeFlags: computeFlags,
    screen: screen,
    context: context,
    visibleSections: visibleSections,
    visibleQuestions: visibleQuestions,
    questionVisible: questionVisible,
    prefill: prefill,
    sectionProgress: sectionProgress,
    missingRequired: missingRequired,
    unanswered: unanswered,
    evaluateRisks: evaluateRisks,
    riskSummary: riskSummary,
    rating: rating,
    applicableLaws: applicableLaws,
    answerText: answerText,
    buildRopa: buildRopa,
    recordId: recordId,
    isBlank: isBlank
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * Report generation: the legal-ready Record of Processing Activities (RoPA) plus the assessment report.
 * Exports: standalone HTML (print to PDF), Word-compatible .doc, CSV (one RoPA row), JSON (full, re-importable).
 */
(function (root) {
  'use strict';
  var PIA = (root.PIA = root.PIA || {});
  var E = PIA.engine;
  var Q = PIA.questions;
  var N = PIA.nist;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' }[c];
    });
  }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
  function chip(label, cls) { return '<span class="r-chip ' + (cls || '') + '">' + esc(label) + '</span>'; }
  function ratingChip(r) { return chip(r, 'r-' + String(r).toLowerCase().replace(/\s+/g, '-')); }
  function fmtDate(iso) { return iso ? new Date(iso).toISOString().slice(0, 10) : ''; }
  function list(items) { return items.length ? '<ul>' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' : ''; }

  var REPORT_CSS = [
    '.pia-report{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d2433;line-height:1.5;font-size:14px;max-width:1000px;margin:0 auto}',
    '.pia-report h1{font-size:24px;margin:0 0 4px}.pia-report h2{font-size:18px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid #e3e7ef}',
    '.pia-report h3{font-size:15px;margin:18px 0 6px}.pia-report p{margin:6px 0}',
    '.pia-report table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}',
    '.pia-report th,.pia-report td{border:1px solid #d6dbe5;padding:6px 8px;text-align:left;vertical-align:top}',
    '.pia-report th{background:#f2f4f8;font-weight:600}',
    '.pia-report .r-meta{color:#5b6475;font-size:13px}.pia-report .r-muted{color:#5b6475}',
    '.pia-report .r-banner{border-radius:8px;padding:12px 16px;margin:14px 0;border:1px solid}',
    '.pia-report .r-ok{background:#e9f7ef;border-color:#9fd4b4}.pia-report .r-warn{background:#fff6e0;border-color:#f0cf7a}.pia-report .r-danger{background:#fdecec;border-color:#ef9a9a}',
    '.pia-report .r-chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #c9d0dd;background:#f2f4f8;margin:1px 2px 1px 0;white-space:nowrap}',
    '.pia-report .r-low{background:#e9f7ef;border-color:#9fd4b4;color:#1e6b3a}.pia-report .r-medium{background:#fff6e0;border-color:#f0cf7a;color:#7a5600}',
    '.pia-report .r-high{background:#ffe9dc;border-color:#f3a77c;color:#8a3a0c}.pia-report .r-critical{background:#fdecec;border-color:#ef9a9a;color:#8f1d1d}',
    '.pia-report .r-none-identified{background:#f2f4f8}',
    '.pia-report .r-ref{color:#5b6475;font-size:12px;white-space:nowrap}',
    '.pia-report .r-sign td{height:42px}',
    '.pia-report ul{margin:4px 0;padding-left:20px}',
    '.pia-report .r-key{width:30%}',
    '@media print{.pia-report{font-size:11px}.pia-report h2{break-after:avoid}.pia-report tr{break-inside:avoid}}'
  ].join('\n');

  function build(state) {
    var ropa = E.buildRopa(state);
    var ctx = ropa.ctx;
    var a = ctx.answers;
    var s = ctx.screening;
    var tier = s.tier;
    var tierInfo = s.tierInfo;
    var risks = ropa.risks;
    var sum = ropa.summary;
    var unanswered = E.unanswered(a, ctx);
    var out = [];

    // Header
    out.push('<div class="pia-report">');
    out.push('<h1>' + esc(a.project_name || 'Untitled project') + '</h1>');
    out.push('<p class="r-meta">Privacy Impact Assessment &amp; Record of Processing Activities &middot; Record ' + esc(E.recordId(state)) +
      ' &middot; Created ' + esc(fmtDate(state.createdAt)) + ' &middot; Updated ' + esc(fmtDate(state.updatedAt)) +
      ' &middot; Status: <strong>' + (state.status === 'submitted' ? 'Submitted to legal' : 'Draft') + '</strong></p>');

    // 1. Summary
    out.push('<h2>1. Summary</h2>');
    if (tierInfo) {
      out.push('<div class="r-banner r-' + tierInfo.tone + '"><strong>' + esc(tierInfo.label) + '</strong><br>' + esc(tierInfo.summary) + '</div>');
    } else {
      out.push('<div class="r-banner r-warn"><strong>Screening not completed.</strong></div>');
    }
    out.push('<table><tbody>');
    out.push('<tr><th class="r-key">Business owner</th><td>' + esc([a.project_owner, a.owner_email, a.department].filter(Boolean).join(', ')) + '</td></tr>');
    out.push('<tr><th>Description</th><td>' + nl2br(a.project_description) + '</td></tr>');
    out.push('<tr><th>Why this outcome</th><td>' + list(s.rationale.map(esc)) + '</td></tr>');
    if (tier !== 'none') {
      out.push('<tr><th>Risks identified</th><td>' + sum.total + ' (' + cfgBands().map(function (b) { return sum.inherent[b] + ' ' + b.toLowerCase(); }).join(', ') + ')</td></tr>');
      out.push('<tr><th>Highest risk before / after actions</th><td>' + ratingChip(sum.highestInherent) + ' &rarr; ' + ratingChip(sum.highestResidual) + '</td></tr>');
      out.push('<tr><th>Open actions</th><td>' + sum.openActions + '</td></tr>');
    }
    out.push('<tr><th>Items to confirm</th><td>' + (s.unsure.length + unanswered.length) + '</td></tr>');
    out.push('</tbody></table>');
    if (tier === 'high' && (sum.highestResidual === 'High' || sum.highestResidual === 'Critical') && (ctx.flags.eu || ctx.flags.uk)) {
      out.push('<div class="r-banner r-danger"><strong>Prior consultation may be required.</strong> High risk remains after planned actions. Under GDPR Article 36, the supervisory authority must be consulted before processing starts if the risk cannot be sufficiently reduced.</div>');
    }

    // 2. RoPA
    var n = 2;
    if (tier === 'none') {
      out.push('<h2>' + n++ + '. Record of Processing Activities</h2><p>Not required: no personal data is processed. This screening record documents that decision.</p>');
    } else {
      out.push('<h2>' + n++ + '. Record of Processing Activities</h2>');
      out.push('<p class="r-muted">Structured to GDPR Article 30(1) for controllers, with additional fields for US state law and internal reporting.</p>');
      out.push('<table><thead><tr><th class="r-key">Field</th><th>Entry</th><th>Ref.</th></tr></thead><tbody>');
      ropa.fields.forEach(function (f) {
        out.push('<tr><th>' + esc(f.label) + '</th><td>' + (f.value ? nl2br(f.value) : '<span class="r-muted">Not provided</span>') + '</td><td class="r-ref">' + esc(f.ref || '') + '</td></tr>');
      });
      out.push('</tbody></table>');
    }

    // 3. Screening
    out.push('<h2>' + n++ + '. Threshold screening record</h2>');
    out.push('<p class="r-muted">High-risk criteria from the EDPB Guidelines on DPIA (WP248 rev.01). Meeting ' + PIA.config.threshold.dpiaCriteria +
      ' or more criteria, or any GDPR Art. 35(3) trigger, requires a full DPIA; one criterion, or ' + PIA.config.threshold.piaElevatingFactors + ' elevating factors, requires a standard PIA. "Not sure" answers are treated as "yes" until confirmed.</p>');
    out.push('<table><thead><tr><th>Criterion</th><th>Answer</th><th>Met?</th></tr></thead><tbody>');
    s.criteria.forEach(function (c) {
      var ans = c.questions.map(function (qid) { return E.answerText(qid, a[qid]); }).filter(Boolean).join(' / ');
      out.push('<tr><td>' + esc(c.id + ' ' + c.label) + '</td><td>' + esc(ans || 'Not answered') + '</td><td>' + (c.met ? (c.unconfirmed ? chip('Yes (unconfirmed)', 'r-medium') : chip('Yes', 'r-high')) : 'No') + '</td></tr>');
    });
    out.push('</tbody></table>');
    if (s.mandatory.length) out.push('<h3>Mandatory DPIA triggers</h3>' + list(s.mandatory.map(function (m) { return esc(m.label); })));
    if (s.elevating.length) out.push('<h3>Elevating factors</h3>' + list(s.elevating.map(function (e) { return esc(e.label) + (e.unconfirmed ? ' (unconfirmed)' : ''); })));

    if (tier !== 'none') {
      // 4. Risk register
      out.push('<h2>' + n++ + '. Risk register</h2>');
      if (!risks.length) {
        out.push('<p>No specific risks were triggered by the answers given.</p>');
      } else {
        out.push('<p class="r-muted">Likelihood and impact are scored 1 to 5 (score = L &times; I). Mapped to the ' + esc(N.version) + '.</p>');
        out.push('<table><thead><tr><th>ID</th><th>Risk and why it was flagged</th><th>NIST PF subcategories</th><th>Problematic data actions / problems for individuals</th><th>Inherent</th><th>Response</th><th>Residual</th></tr></thead><tbody>');
        risks.forEach(function (r) {
          out.push('<tr><td>' + esc(r.id) + '</td><td><strong>' + esc(r.title) + '</strong>' + list(r.reasons.map(esc)) + '</td>' +
            '<td>' + r.nist.map(function (x) { return '<span title="' + esc(N.subcategories[x]) + '">' + esc(x) + '</span>'; }).join('<br>') + '</td>' +
            '<td>' + esc(r.actions.join(', ')) + '<br><span class="r-muted">' + esc(r.problems.map(function (p) { return N.problems[p].label; }).join(', ')) + '</span></td>' +
            '<td>' + ratingChip(r.rating) + '<br><span class="r-muted">L' + r.likelihood + ' &times; I' + r.impact + ' = ' + r.score + '</span></td>' +
            '<td>' + esc(r.statusLabel) + (r.owner ? '<br>Owner: ' + esc(r.owner) : '') + (r.due ? '<br>Due: ' + esc(r.due) : '') + (r.notes ? '<br><span class="r-muted">' + nl2br(r.notes) + '</span>' : '') + '</td>' +
            '<td>' + ratingChip(r.residualRating) + (r.residualProjected ? '<br><span class="r-muted">projected</span>' : '') + '</td></tr>');
        });
        out.push('</tbody></table>');
      }

      // 5. NIST PF coverage
      out.push('<h2>' + n++ + '. NIST Privacy Framework alignment</h2>');
      out.push('<table><thead><tr><th>Function</th><th>Risks</th><th>Subcategories needing attention</th></tr></thead><tbody>');
      Object.keys(N.functions).forEach(function (fn) {
        var subs = Object.keys(sum.subcategories).filter(function (x) { return N.functionOf(x) === fn; }).sort();
        out.push('<tr><td><strong>' + esc(N.functions[fn].name) + '</strong><br><span class="r-muted">' + esc(N.functions[fn].desc) + '</span></td><td>' + sum.byFunction[fn] + '</td><td>' +
          (subs.length ? subs.map(function (x) { return '<strong>' + esc(x) + '</strong> ' + esc(N.subcategories[x]) + ' <span class="r-muted">(' + esc(sum.subcategories[x].join(', ')) + ')</span>'; }).join('<br>') : '<span class="r-muted">None flagged</span>') + '</td></tr>');
      });
      out.push('</tbody></table>');

      // 6. Action plan
      out.push('<h2>' + n++ + '. Action plan</h2>');
      var open = risks.filter(function (r) { return r.status !== 'implemented'; });
      if (!open.length) out.push('<p>No open actions.</p>');
      else {
        out.push('<table><thead><tr><th>Risk</th><th>Recommended actions</th><th>Status</th><th>Owner</th><th>Due</th></tr></thead><tbody>');
        open.forEach(function (r) {
          out.push('<tr><td>' + esc(r.id + ' ' + r.title) + '</td><td>' + list(r.mitigations.map(esc)) + '</td><td>' + esc(r.statusLabel) + '</td><td>' + esc(r.owner) + '</td><td>' + esc(r.due) + '</td></tr>');
        });
        out.push('</tbody></table>');
      }

      // 7. Applicable laws
      out.push('<h2>' + n++ + '. Potentially applicable laws</h2>');
      out.push('<p class="r-muted">Indicative only, generated from the answers. Legal to confirm.</p>');
      out.push(ropa.laws.length ? '<table><thead><tr><th>Law</th><th>Why it may apply</th></tr></thead><tbody>' + ropa.laws.map(function (l) { return '<tr><td>' + esc(l.law) + '</td><td>' + esc(l.why) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p>None identified. Check where data subjects are located.</p>');
    }

    // Items to confirm
    out.push('<h2>' + n++ + '. Items to confirm</h2>');
    if (!s.unsure.length && !unanswered.length) out.push('<p>None. All questions answered.</p>');
    if (s.unsure.length) out.push('<h3>Answered "not sure" (treated as yes)</h3>' + list(s.unsure.map(function (u) { return esc(u.label); })));
    if (unanswered.length) out.push('<h3>Not answered</h3>' + list(unanswered.map(function (u) { return esc(u.section + ': ' + u.label); })));
    if (a.concerns) out.push('<h3>Concerns raised by the project team</h3><p>' + nl2br(a.concerns) + '</p>');

    // Appendix: Q&A
    out.push('<h2>' + n++ + '. Appendix: all answers</h2>');
    E.visibleSections(a, ctx).forEach(function (sec) {
      var rows = E.visibleQuestions(sec, a, ctx).map(function (q) {
        var v = E.answerText(q.id, a[q.id]);
        return '<tr><td class="r-key">' + esc(Q.stripTerms(q.label)) + '</td><td>' + (v ? nl2br(v) : '<span class="r-muted">Not answered</span>') + '</td></tr>';
      });
      out.push('<h3>' + esc(Q.stripTerms(sec.title)) + '</h3><table><tbody>' + rows.join('') + '</tbody></table>');
    });

    // Sign-off
    out.push('<h2>' + n++ + '. Review and sign-off</h2>');
    out.push('<table class="r-sign"><thead><tr><th>Role</th><th>Name</th><th>Decision / comments</th><th>Date</th></tr></thead><tbody>' +
      ['Business owner', 'Privacy team / DPO', 'Information security', 'Legal'].map(function (r) { return '<tr><td>' + r + '</td><td></td><td></td><td></td></tr>'; }).join('') +
      '</tbody></table>');
    out.push('<p class="r-muted">Generated by ' + esc(PIA.config.appName) + '. This assessment supports, but does not replace, legal advice.</p>');
    out.push('</div>');
    return out.join('\n');
  }

  function cfgBands() { return PIA.config.risk.bands.map(function (b) { return b.label; }); }

  function toHTML(state) {
    var title = 'PIA & RoPA: ' + ((state.answers && state.answers.project_name) || 'Untitled');
    return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(title) +
      '</title><style>body{margin:24px;background:#fff}' + REPORT_CSS + '</style></head><body>' + build(state) + '</body></html>';
  }

  // Word opens HTML saved with a .doc extension; this keeps tables and headings intact.
  function toDoc(state) {
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>' +
      REPORT_CSS + ' body{font-family:Calibri,Arial,sans-serif}</style></head><body>' + build(state) + '</body></html>';
  }

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // One row per processing activity, so rows from many assessments can be appended into a central register.
  function toCSV(state) {
    var fields = E.buildRopa(state).fields;
    return '﻿' + [fields.map(function (f) { return csvCell(f.label); }).join(','), fields.map(function (f) { return csvCell(f.value); }).join(',')].join('\r\n') + '\r\n';
  }

  function toJSON(state) {
    var ropa = E.buildRopa(state);
    return JSON.stringify({
      format: 'pia-intake/v1',
      exportedAt: new Date().toISOString(),
      assessment: state,
      computed: {
        recordId: E.recordId(state),
        tier: ropa.ctx.screening.tier,
        screening: {
          rationale: ropa.ctx.screening.rationale,
          criteriaMet: ropa.ctx.screening.criteriaMet.map(function (c) { return c.id; }),
          mandatory: ropa.ctx.screening.mandatory.map(function (m) { return m.id; }),
          unsure: ropa.ctx.screening.unsure.map(function (u) { return u.id; })
        },
        ropa: ropa.fields.reduce(function (o, f) { o[f.key] = f.value; return o; }, {}),
        risks: ropa.risks.map(function (r) {
          return { id: r.id, title: r.title, reasons: r.reasons, nist: r.nist, problematicDataActions: r.actions, problems: r.problems, likelihood: r.likelihood, impact: r.impact, score: r.score, rating: r.rating, status: r.status, owner: r.owner, due: r.due, residualRating: r.residualRating };
        }),
        applicableLaws: ropa.laws
      }
    }, null, 2);
  }

  PIA.report = { build: build, toHTML: toHTML, toDoc: toDoc, toCSV: toCSV, toJSON: toJSON, esc: esc, CSS: REPORT_CSS };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * UI controller: rendering, navigation, autosave, glossary, exports.
 */
(function () {
  'use strict';
  var PIA = window.PIA;
  var E = PIA.engine, Q = PIA.questions, R = PIA.report, N = PIA.nist, cfg = PIA.config;
  var esc = R.esc;

  /* ---------- Storage (falls back to memory when localStorage is unavailable) ---------- */
  var memory = {};
  function loadAll() {
    try { var raw = localStorage.getItem(cfg.storageKey); return raw ? JSON.parse(raw) : memory; } catch (e) { return memory; }
  }
  function saveAll(all) {
    memory = all;
    try { localStorage.setItem(cfg.storageKey, JSON.stringify(all)); return true; } catch (e) { return false; }
  }

  var app = { view: 'home', cur: null, step: 'about', idx: 0, errors: {}, riskIds: [], navOpen: false };
  var saveTimer = null;

  function $(sel) { return document.querySelector(sel); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function now() { return new Date().toISOString(); }

  function newAssessment(answers) {
    var t = now();
    return { id: uid(), createdAt: t, updatedAt: t, status: 'draft', answers: answers || {}, risks: {}, step: 'about', idx: 0 };
  }

  function persist(immediate) {
    if (!app.cur) return;
    clearTimeout(saveTimer);
    var doSave = function () {
      app.cur.updatedAt = now();
      app.cur.step = app.step;
      app.cur.idx = app.idx;
      var all = loadAll();
      all[app.cur.id] = app.cur;
      var ok = saveAll(all);
      $('#save-state').textContent = ok ? 'Saved on this device' : 'Not saved: storage is unavailable, so download a backup';
    };
